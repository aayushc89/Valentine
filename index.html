<!DOCTYPE html>
<html>
<head>
  <title>Valentine 💖</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffd6e8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      margin: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #yes { background: #ff4d6d; color: white; }
    #no {
      background: #eee;
      position: absolute;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Hi Jishu, will you be my Valentine? 💖</h1>

  <button id="yes" onclick="yesClick()">YES</button>
  <button id="no">NO</button>

  <div id="gallery" style="margin-top:20px;"></div>
</div>
<script>
  function yesClick() {
    alert("Yay! ❤️ See you on Valentine’s Day!");
  }

  let noCount = 0;

  const memories = [
    { img: "mem1.jpg", text: "This smile still makes my day 💕" },
    { img: "mem2.jpg", text: "This moment felt like home 🫶" },
    { img: "mem3.jpg", text: "If this is us… how can it be a no? ❤️" }
  ];

  const noBtn = document.getElementById("no");
  const gallery = document.getElementById("gallery");

  noBtn.addEventListener("click", () => {
    if (noCount < memories.length) {
     gallery.innerHTML = `
  <img src="${memories[noCount].img}" 
       style="width:130px;border-radius:12px;display:block;margin:auto;">
  <p style="margin-top:10px;">${memories[noCount].text}</p>
`; 
      noCount++;
    } else {
      noBtn.innerText = "Okay… I remember now ❤️";
    }
  });
</script>

</body>
</html>
